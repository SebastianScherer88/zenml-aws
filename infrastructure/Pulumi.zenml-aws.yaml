config:
  aws:region: eu-west-1
  # --- Developer access -------------------------------------------------
  # ALB ingress (dashboard + REST API) is restricted to these CIDRs only.
  # This is the ONLY way developers reach the stack — RDS is never exposed.
  # e.g. your home/office IP or a VPN egress range: ["1.2.3.4/32"]
  zenml-aws:security:
    allowed_cidrs: [45.150.147.155/32] # <-- replace with your dev instance IP/32 before applying
  # --- ZenML server (app server + dashboard, single container/port) -----
  zenml-aws:server:
    image: docker.io/zenmldocker/zenml-server:0.96.3
    port: 8080
    desired-count: 1
    default-user-name: default # name: seb
    default-project-name: default
    resources:
      cpu: 1024
      memory: 2048
  # --- RDS metadata store (MySQL — required by ZenML's SQL store) -------
  zenml-aws:metadata-store:
    instance-class: db.t3.micro
    engine-version: 8.4
    allocated-storage: 20
    username: zenml
    name: zenml
    port: 5432
  # --- AWS Batch compute resources (for the ZenML Batch step operator) --
  zenml-aws:batch:
    queues:
      - name: fargate-queue
        compute-environments:
          - name: fargate-ce
            max_vcpus: 16
            type: FARGATE
      - name: ec2-queue
        compute-environments:
          - name: ec2-cpu-ce
            max_vcpus: 16
            type: EC2
            instance_types: ["m5.large", "m5.xlarge", "c5.2xlarge", "c5.4xlarge"]
          - name: ec2-gpu-ce
            max_vcpus: 16
            type: EC2
            instance_types: [
              # General-purpose inference / smaller GPUs
              "g4ad.xlarge", "g4ad.2xlarge", "g4ad.4xlarge", "g4ad.8xlarge", "g4ad.16xlarge", "g4dn.xlarge", "g4dn.2xlarge", "g4dn.4xlarge", "g4dn.8xlarge", "g4dn.12xlarge", "g4dn.16xlarge", "g4dn.metal", "g5.xlarge", "g5.2xlarge", "g5.4xlarge", "g5.8xlarge", "g5.12xlarge", "g5.16xlarge",
              # "g5.24xlarge", "g5.48xlarge",

              "g6.xlarge", "g6.2xlarge", "g6.4xlarge", "g6.8xlarge", "g6.12xlarge", "g6.16xlarge",
              # "g6.24xlarge", "g6.48xlarge",
            ]
            # Newer GPU family
            # # A100
            # "p4d.24xlarge",
